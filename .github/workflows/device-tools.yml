name: Windows device tools
on:
  push:
    branches: [main]
    paths: [Tools/DeviceTools/**, .github/workflows/device-tools.yml]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: device-tools-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      update: ${{ steps.prepare.outputs.update }}
    steps:
      - uses: actions/checkout@v4
      - name: Test stable release discovery
        env:
          PYTHONPATH: Tools/DeviceTools
        run: |
          python3 -m unittest discover -s Tools/DeviceTools/Tests -v
      - name: Check stable upstream releases and prepare candidate
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/DeviceTools/Scripts/check_updates.py
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.build == 'true'
        with:
          name: device-tools-candidate
          retention-days: 7
          path: |
            Tools/DeviceTools/pins.json
            Tools/DeviceTools/stable.json
            Tools/DeviceTools/VERSION
            Tools/DeviceTools/changelog.md
  recover:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      published: ${{ steps.recover.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover a tested native draft without recompiling
        if: needs.prepare.outputs.update != 'true'
        id: recover
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./Tools/DeviceTools/Scripts/Publish-TestedDraft.ps1
  build:
    needs: [prepare, recover]
    if: needs.prepare.outputs.build == 'true' && needs.recover.outputs.published != 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: device-tools-candidate
          path: Tools/DeviceTools
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make autoconf automake libtool
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl mingw-w64-x86_64-curl
            mingw-w64-x86_64-libzip mingw-w64-x86_64-python
      - name: Build pinned sources and package Windows binaries
        shell: msys2 {0}
        run: bash Tools/DeviceTools/Scripts/build.sh
      - name: Verify standalone Windows command line tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
          $manifest=Get-Content device-build/package/sha256.json -Raw | ConvertFrom-Json
          foreach($entry in $manifest.PSObject.Properties){
            $file=Join-Path (Join-Path $PWD 'device-build/package') $entry.Name
            if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $entry.Value){throw 'Device package checksum mismatch'}
          }
          $folder=Join-Path $PWD 'device-build/package/windows_amd64'
          foreach($name in @('idevice_id','ideviceinfo','ideviceinstaller','idevicepair')){
            $version=& "$folder/$name.exe" --version 2>&1
            if($LASTEXITCODE -ne 0 -or !$version){throw "$name failed outside MSYS2"}
            $help=& "$folder/$name.exe" --help 2>&1
            if($LASTEXITCODE -ne 0 -or !$help){throw "$name help failed"}
            if($name -eq 'idevice_id' -and (($help -join "`n") -notmatch '--list')){throw 'Device listing CLI contract changed'}
            if($name -eq 'ideviceinfo' -and ((($help -join "`n") -notmatch '--udid') -or (($help -join "`n") -notmatch '--key'))){throw 'Device info CLI contract changed'}
            if($name -eq 'ideviceinstaller' -and (($help -join "`n") -notmatch 'install PATH')){throw 'Installer CLI contract changed'}
            if($name -ne 'idevicepair' -and ($help -join "`n") -notmatch '--network'){throw "$name network transport missing"}
            if($name -eq 'idevicepair'){
              foreach($command in @('validate','pair','unpair')){if(($help -join "`n") -notmatch ("\b"+$command+"\b")){throw "Pairing command missing: $command"}}
            }
            Write-Host "$name : $version"
          }
      - name: Persist tested upstream versions
        if: needs.prepare.outputs.update == 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tools/DeviceTools/pins.json Tools/DeviceTools/stable.json Tools/DeviceTools/VERSION Tools/DeviceTools/changelog.md
          $version=(Get-Content Tools/DeviceTools/VERSION -Raw).Trim()
          git commit -m "Update stable device tool sources for $version"
          if($LASTEXITCODE -ne 0){throw 'Could not commit tested sources'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'Main changed or source update was rejected; no release will be published. Retry the workflow.'}
      - name: Publish own tools and source archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version=(Get-Content Tools/DeviceTools/VERSION -Raw).Trim()
          $tag="device-tools-v$version"
          $all=gh api "repos/$env:GH_REPO/releases?per_page=100"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Could not read existing native releases'}
          $existing=@($all|Where-Object tag_name -eq $tag)
          if($existing.Count -gt 1){throw 'Ambiguous draft release'}
          if($existing.Count -eq 1){
            $release=$existing[0]
            if(!$release.draft){throw 'This version is already public; published assets will not be replaced.'}
            $target=git rev-parse HEAD
            gh api --method PATCH "repos/$env:GH_REPO/releases/$($release.id)" -f target_commitish=$target | Out-Null
            if($LASTEXITCODE -ne 0){throw 'Could not update tested draft target'}
            foreach($name in @("IPA-DeviceTools-$version-Windows-x64.zip","IPA-DeviceTools-$version-Sources.zip")){
              foreach($asset in @($release.assets|Where-Object name -eq $name)){
                gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$($asset.id)"
                if($LASTEXITCODE -ne 0){throw 'Could not replace incomplete draft asset'}
              }
              $upload=$release.upload_url.Replace('{?name,label}','')+'?name='+[Uri]::EscapeDataString($name)
              Invoke-WebRequest -Uri $upload -Method Post -Headers @{Authorization="Bearer $env:GH_TOKEN"} -ContentType 'application/zip' -InFile $name | Out-Null
            }
          }else{
            $target=git rev-parse HEAD
            gh release create $tag "IPA-DeviceTools-$version-Windows-x64.zip" "IPA-DeviceTools-$version-Sources.zip" --draft --target $target --title "IPA Desktop Device Tools $version" --notes-file Tools/DeviceTools/changelog.md --latest=false
            if($LASTEXITCODE -ne 0){throw 'Failed to create tool release draft'}
            $all=gh api "repos/$env:GH_REPO/releases?per_page=100"|ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Could not locate created draft'}
            $match=@($all|Where-Object tag_name -eq $tag)
            if($match.Count -ne 1){throw 'Uploaded draft not found unambiguously'}
            $release=$match[0]
          }
          $release=gh api "repos/$env:GH_REPO/releases/$($release.id)"|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or !$release.draft){throw 'Could not validate uploaded draft'}
          foreach($name in @("IPA-DeviceTools-$version-Windows-x64.zip","IPA-DeviceTools-$version-Sources.zip")){
            $assets=@($release.assets|Where-Object name -eq $name)
            if($assets.Count -ne 1 -or $assets[0].size -le 0 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$'){throw 'Incomplete assets; release remains a draft'}
          }
          gh api --method PATCH "repos/$env:GH_REPO/releases/$($release.id)" -F draft=false -f make_latest=false | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Failed to publish validated tool release by ID'}
