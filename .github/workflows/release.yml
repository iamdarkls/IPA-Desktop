name: Desktop release
on:
  push:
    branches: [main]
    paths: ['IPA-Desktop.csproj', 'MainWindow.axaml', 'App.axaml', 'Source/**', 'Tests/**', 'Scripts/**', '.github/workflows/release.yml', 'Tools/AccountSafety/**', 'Tools/Portable/**', 'global.json', 'Directory.Build.props']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-main
  cancel-in-progress: false
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      package: ${{ steps.release.outputs.package }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Plan platform checks and release
        id: release
        run: python3 Scripts/desktop.py metadata
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.rid }}-
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libglib2.0-bin
      - name: Build and test application before native compilation
        run: python Scripts/desktop.py test --rid ${{ matrix.rid }}
      - name: Identify native inputs and runner image
        if: runner.os != 'Windows' && needs.prepare.outputs.package == 'true'
        id: native-key
        run: python3 Tools/Portable/native-cache.py key --rid ${{ matrix.rid }}
      - uses: actions/cache@v6.1.0
        if: runner.os != 'Windows' && needs.prepare.outputs.package == 'true'
        with:
          path: |
            artifacts/unix/native
            artifacts/unix/native-sources.zip
            artifacts/unix/cache.json
          key: ${{ steps.native-key.outputs.key }}
      - name: Validate native cache or matching verified release
        if: runner.os != 'Windows' && needs.prepare.outputs.package == 'true'
        id: native
        run: python3 Tools/Portable/native-cache.py prepare --rid ${{ matrix.rid }}
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux' && needs.prepare.outputs.package == 'true' && steps.native.outputs.ready != 'true'
        run: sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build libssl-dev libcurl4-openssl-dev libzip-dev libminizip-dev libmbedtls-dev nlohmann-json3-dev libunicorn-dev patchelf
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS' && needs.prepare.outputs.package == 'true' && steps.native.outputs.ready != 'true'
        run: brew install autoconf automake libtool pkgconf cmake ninja openssl@3 libzip minizip nlohmann-json dylibbundler
      - name: Build changed native inputs
        if: runner.os != 'Windows' && needs.prepare.outputs.package == 'true' && steps.native.outputs.ready != 'true'
        run: |
          if [[ "$RUNNER_OS" == macOS ]];then
            export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libzip)/lib/pkgconfig"
            export CMAKE_PREFIX_PATH="$(brew --prefix)"
          fi
          bash Tools/Portable/build-native.sh
          python3 Tools/Portable/native-cache.py record --rid ${{ matrix.rid }}
      - name: Verify cached or rebuilt native tools and authentication safeguards
        if: runner.os != 'Windows' && needs.prepare.outputs.package == 'true'
        run: python3 Tools/Portable/native-cache.py check --rid ${{ matrix.rid }}
      - name: Check Windows guarded engine release
        if: runner.os == 'Windows' && needs.prepare.outputs.package == 'true'
        id: engine
        shell: pwsh
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release view $pin.tag --json assets 2>$null | Out-Null
          "build=$((-not ($LASTEXITCODE -eq 0)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: msys2/setup-msys2@v2
        if: steps.engine.outputs.build == 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-minizip mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2 mingw-w64-x86_64-nlohmann-json
      - name: Build guarded Windows engine if missing
        if: steps.engine.outputs.build == 'true'
        shell: msys2 {0}
        run: bash Tools/AccountSafety/build.sh
      - name: Publish verified Windows guarded engine
        if: steps.engine.outputs.build == 'true'
        shell: pwsh
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release create $pin.tag "artifacts/IPA-AuthTools-$($pin.version)-Windows-x64.zip" "artifacts/IPA-AuthTools-$($pin.version)-Sources.zip" --target $env:GITHUB_SHA --title "ipatool $($pin.version) — guarded authentication" --notes-file Tools/AccountSafety/README.md --latest=false
          if($LASTEXITCODE -ne 0){throw 'Guarded engine release failed'}
      - name: Package and verify shipping application
        if: needs.prepare.outputs.package == 'true'
        run: python Scripts/desktop.py package --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/release/*.zip
            artifacts/tests/**
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish complete verified release
        run: python3 Scripts/desktop.py publish
