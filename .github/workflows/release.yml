name: Windows release
on:
  push:
    branches: [main]
    paths: ['IPA-Desktop.csproj', '.github/workflows/release.yml', 'Tools/AccountSafety/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release version
        id: version
        run: |
          $project=[xml](Get-Content IPA-Desktop.csproj -Raw)
          $version=$project.Project.PropertyGroup.Version
          if(!$version -or !(Test-Path "changelogs/v$version.md")){throw 'Missing version/changelog'}
          if((Get-Content Source/Domain/Updates/AppInfo.cs -Raw) -notmatch ('Version = "'+[regex]::Escape($version)+'"')){throw 'Runtime and project versions differ'}
          "IPA_VERSION=$version" >> $env:GITHUB_ENV
          gh release view "v$version" --json tagName 2>$null | Out-Null
          $published=$LASTEXITCODE -eq 0
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $verify=(!$published) -or ('${{ github.event_name }}' -eq 'workflow_dispatch')
          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if($published){Write-Host "Release v$version already published. Bump the project version to publish a new build; use manual dispatch to verify this version."}
          exit 0
      - name: Check guarded engine release
        if: steps.version.outputs.verify == 'true'
        id: engine
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release view $pin.tag --json assets 2>$null | Out-Null
          "build=$((-not ($LASTEXITCODE -eq 0)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: msys2/setup-msys2@v2
        if: steps.engine.outputs.build == 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-minizip mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2 mingw-w64-x86_64-nlohmann-json
      - name: Build and verify guarded ipatool without Apple accounts
        if: steps.engine.outputs.build == 'true'
        shell: msys2 {0}
        run: bash Tools/AccountSafety/build.sh
      - name: Publish verified guarded engine
        if: steps.engine.outputs.build == 'true'
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release create $pin.tag "artifacts/IPA-AuthTools-$($pin.version)-Windows-x64.zip" "artifacts/IPA-AuthTools-$($pin.version)-Sources.zip" --target $env:GITHUB_SHA --title "ipatool $($pin.version) — guarded authentication" --notes-file Tools/AccountSafety/README.md --latest=false
          if($LASTEXITCODE -ne 0){throw 'Guarded engine release failed'}
      - uses: actions/setup-dotnet@v6.0.0
        if: steps.version.outputs.verify == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Build and test application
        if: steps.version.outputs.verify == 'true'
        run: |
          dotnet build Tests/Modern/IPA-Desktop.Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          dotnet test Tests/Modern/IPA-Desktop.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=normal"
          if($LASTEXITCODE -ne 0){throw 'Application tests failed'}
      - name: Publish self-contained Windows executable
        if: steps.version.outputs.verify == 'true'
        run: |
          dotnet publish IPA-Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          python Scripts/package.py artifacts/publish
          if($LASTEXITCODE -ne 0){throw 'Portable package or legacy size limits failed'}
      - name: Verify packaged application and updater
        if: steps.version.outputs.verify == 'true'
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/Verify-Package.ps1 -Archive "IPA-Desktop-$env:IPA_VERSION-Windows.zip"
          if($LASTEXITCODE -ne 0){throw 'Shipping package or update migration failed'}
      - name: Publish release
        if: steps.version.outputs.published != 'true' && github.ref == 'refs/heads/main'
        run: |
          $tag="v$env:IPA_VERSION"
          gh release view $tag --json tagName 2>$null
          if($LASTEXITCODE -eq 0){Write-Host "Release $tag already exists; published files unchanged.";exit 0}
          gh release create $tag "IPA-Desktop-$env:IPA_VERSION-Windows.zip" --target $env:GITHUB_SHA --title "IPA Desktop $env:IPA_VERSION" --notes-file "changelogs/$tag.md" --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
