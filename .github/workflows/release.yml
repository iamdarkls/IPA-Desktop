name: Windows release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - MainWindow.xaml
      - '*.cs'
      - 'Source/**'
      - '*.ps1'
      - Build.cmd
      - Assets/**
      - Tests/**
      - Scripts/**
      - Generated/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: |
          $xaml = Get-Content MainWindow.xaml -Raw -Encoding UTF8
          if ($xaml -notmatch 'Title="IPA Desktop[^"\r\n]*?(\d+\.\d+\.\d+)"') { throw 'Missing version in window title' }
          "IPA_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          if (!(Test-Path "changelogs/v$($Matches[1]).md")) { throw 'Write the changelog before publishing a version.' }
      - name: Verify generated portable sources
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/Sync-Sources.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'Source snapshots do not match canonical classes' }
      - name: Build
        shell: cmd
        run: call Build.cmd < nul
      - name: Verify application and IPA metadata
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File Tests/Verify.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Application verification failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/Verify-IpaMetadata.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Metadata verification failed' }
      - name: Verify updater
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/Verify-Updater.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updater verification failed' }
      - name: Verify design
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File Tests/Verify-Design.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Design verification failed' }
      - name: Verify services and controller integration
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File Tests/Verify-Services.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Refactored services or controllers failed' }
      - name: Verify private interactive Apple login
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File Tests/Verify-AppleLogin.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Private Apple login verification failed' }
      - name: Verify direct ipatool migration and actual Windows release
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/Verify-Engine.ps1 -Live
          if ($LASTEXITCODE -ne 0) { throw 'Direct upstream engine or migration failed' }
      - name: Verify app sets, storage, progress and diagnostic privacy
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/Verify-WorkflowFeatures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Application workflow features failed' }
      - name: Package
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/Package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Verify legacy and organized package layouts
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/Verify-Layout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Layout migration or organized update failed' }
      - name: Publish releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = Get-Item "IPA-Desktop-$env:IPA_VERSION-Windows.zip"
          foreach ($archive in $archives) {
            if ($archive.Name -notmatch '^IPA-Desktop-(\d+\.\d+\.\d+)-Windows.zip$') { throw 'Invalid archive name' }
            $version = $Matches[1]
            $tag = "v$version"
            gh release view $tag --json tagName 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; leaving published assets unchanged."
              continue
            }
            $latest = if ($version -eq $env:IPA_VERSION) { '--latest' } else { '--latest=false' }
            gh release create $tag $archive.FullName --target $env:GITHUB_SHA --title "IPA Desktop $version" --notes-file "changelogs/$tag.md" $latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag" }
          }
