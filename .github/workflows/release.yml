name: Desktop release
on:
  push:
    branches: [main]
    paths: ['IPA-Desktop.csproj', '.github/workflows/release.yml', 'Tools/AccountSafety/**', 'Tools/Portable/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check release version
        id: version
        run: |
          $project=[xml](Get-Content IPA-Desktop.csproj -Raw)
          $version=$project.Project.PropertyGroup.Version
          if(!$version -or !(Test-Path "changelogs/v$version.md")){throw 'Missing version/changelog'}
          if((Get-Content Source/Domain/Updates/AppInfo.cs -Raw) -notmatch ('Version = "'+[regex]::Escape($version)+'"')){throw 'Runtime and project versions differ'}
          "IPA_VERSION=$version" >> $env:GITHUB_ENV
          gh release view "v$version" --json tagName 2>$null | Out-Null
          $published=$LASTEXITCODE -eq 0
          "published=$($published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $verify=(!$published) -or ('${{ github.event_name }}' -eq 'workflow_dispatch')
          "verify=$($verify.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if($published){Write-Host "Release v$version already published. Bump the project version to publish a new build; use manual dispatch to verify this version."}
          exit 0
      - name: Check guarded engine release
        if: steps.version.outputs.verify == 'true'
        id: engine
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release view $pin.tag --json assets 2>$null | Out-Null
          "build=$((-not ($LASTEXITCODE -eq 0)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: msys2/setup-msys2@v2
        if: steps.engine.outputs.build == 'true'
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-minizip mingw-w64-x86_64-zlib
            mingw-w64-x86_64-bzip2 mingw-w64-x86_64-nlohmann-json
      - name: Build and verify guarded ipatool without Apple accounts
        if: steps.engine.outputs.build == 'true'
        shell: msys2 {0}
        run: bash Tools/AccountSafety/build.sh
      - name: Publish verified guarded engine
        if: steps.engine.outputs.build == 'true'
        run: |
          $pin=Get-Content Tools/AccountSafety/pins.json -Raw | ConvertFrom-Json
          gh release create $pin.tag "artifacts/IPA-AuthTools-$($pin.version)-Windows-x64.zip" "artifacts/IPA-AuthTools-$($pin.version)-Sources.zip" --target $env:GITHUB_SHA --title "ipatool $($pin.version) — guarded authentication" --notes-file Tools/AccountSafety/README.md --latest=false
          if($LASTEXITCODE -ne 0){throw 'Guarded engine release failed'}
      - uses: actions/setup-dotnet@v6.1.0
        if: steps.version.outputs.verify == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Build and test application
        if: steps.version.outputs.verify == 'true'
        run: |
          dotnet build Tests/Modern/IPA-Desktop.Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          dotnet test Tests/Modern/IPA-Desktop.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=normal"
          if($LASTEXITCODE -ne 0){throw 'Application tests failed'}
      - name: Publish self-contained Windows executable
        if: steps.version.outputs.verify == 'true'
        run: |
          dotnet publish IPA-Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          python Scripts/package.py artifacts/publish
          if($LASTEXITCODE -ne 0){throw 'Portable package or legacy size limits failed'}
      - name: Verify packaged application and updater
        if: steps.version.outputs.verify == 'true'
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Scripts/Verify-Package.ps1 -Archive "IPA-Desktop-$env:IPA_VERSION-Windows.zip"
          if($LASTEXITCODE -ne 0){throw 'Shipping package or update migration failed'}
      - uses: actions/upload-artifact@v7.0.2
        if: steps.version.outputs.verify == 'true'
        with:
          name: windows-release
          path: IPA-Desktop-*-Windows.zip
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build libssl-dev libcurl4-openssl-dev libzip-dev libminizip-dev libmbedtls-dev nlohmann-json3-dev libunicorn-dev patchelf xvfb libx11-6 libice6 libsm6 libfontconfig1 libglib2.0-bin
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkgconf cmake ninja openssl@3 libzip minizip nlohmann-json dylibbundler
      - name: Build guarded engine and iPhone tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]];then
            export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libzip)/lib/pkgconfig"
            export CMAKE_PREFIX_PATH="$(brew --prefix)"
          fi
          bash Tools/Portable/build-native.sh
      - name: Build and test native platform
        shell: bash
        run: |
          dotnet build Tests/Modern/IPA-Desktop.Tests.csproj -c Release
          mkdir -p Tests/Modern/bin/Release/net10.0/native
          cp artifacts/unix/native/ipa-pty Tests/Modern/bin/Release/net10.0/native/
          dotnet test Tests/Modern/IPA-Desktop.Tests.csproj -c Release --no-build --no-restore --logger "console;verbosity=normal"
      - name: Publish package and verify actual GUI
        shell: bash
        run: |
          dotnet publish IPA-Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o artifacts/publish
          python3 Tools/Portable/package.py ${{ matrix.rid }} artifacts/publish
          archive=$(find artifacts -maxdepth 1 -name 'IPA-Desktop-*-Linux-*.zip' -o -name 'IPA-Desktop-*-macOS-*.zip')
          if [[ "$RUNNER_OS" == Linux ]];then xvfb-run -a python3 Tools/Portable/verify.py "$archive";else python3 Tools/Portable/verify.py "$archive";fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/IPA-Desktop-*.zip
  publish:
    needs: [release, unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Publish verified platform releases together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E;print(E.parse('IPA-Desktop.csproj').findtext('.//Version'))")
          if gh release view "v$version" >/dev/null 2>&1;then echo "Already published";exit 0;fi
          test $(find artifacts/release -name '*.zip' | wc -l) -eq 7
          gh release create "v$version" artifacts/release/*.zip --target "$GITHUB_SHA" --title "IPA Desktop $version — Windows, macOS, Linux" --notes-file "changelogs/v$version.md" --latest
